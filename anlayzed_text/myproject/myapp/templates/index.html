<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> template is working </title>
</head>
<body>
    <h1>welcome to the analazer. enter your text below </h1>
    <form action="/analyze" method="POST">{% csrf_token %}
        <textarea name="text" style="margin: 0px; width: 809px; height: 195px;"></textarea><br>
        <input type="checkbox" name="removepunc">Remove Punctuations <br>
        <input type="checkbox" name="fullcaps">UPPERCASE<br>
        <input type="checkbox" name="newlineremover">New Line Remover <br>
        <input type="checkbox" name="extraspaceremove">Extra Spaces Remove<br>

        <button type="submit"> Analyze Text </button>
    </form>
    
</body>
</html>
